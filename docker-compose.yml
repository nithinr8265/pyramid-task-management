services:
  mongodb:
    image: mongo:7
    container_name: pyramid-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: examplepassword
      MONGO_INITDB_DATABASE: pyramid
    entrypoint:
      - bash
      - -c
      - |
        echo "cFlyYW1pZG1vbmdvcmVwbGljYWtleWZvcmxvY2FsZGV2ZWxvcG1lbnQ=" > /data/replica.key
        chmod 400 /data/replica.key
        chown 999:999 /data/replica.key
        exec docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all --keyFile /data/replica.key
    healthcheck:
      test:
        - CMD-SHELL
        - |
          mongosh -u root -p examplepassword --authenticationDatabase admin --quiet --eval "
            try {
              const status = rs.status();
              if (status.ok === 1 && status.members && status.members.some(m => m.state === 1)) {
                quit(0);
              }
              quit(1);
            } catch (e) {
              try {
                rs.initiate({
                  _id: 'rs0',
                  members: [{ _id: 0, host: 'mongodb:27017' }]
                });
                quit(0);
              } catch (err) {
                quit(1);
              }
            }
          "
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pyramid-backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "mongodb://root:examplepassword@mongodb:27017/pyramid?authSource=admin&replicaSet=rs0"
      JWT_SECRET: "super-secret-jwt-key-change-in-production"
      JWT_EXPIRES_IN: "7d"
      GOOGLE_CLIENT_ID: "160368229883-i7dcqojrdculqi3smi2h9tjoom5d6aoo.apps.googleusercontent.com"
      CORS_ORIGIN: "http://localhost:3001,http://localhost:3000"
      PORT: 3000
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongo_data:
