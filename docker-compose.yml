services:
  mongodb:
    image: mongo:7
    container_name: pyramid-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: examplepassword
      MONGO_INITDB_DATABASE: pyramid
    command: ["--replSet", "rs0", "--bind_ip_all"]
    healthcheck:
      test: >
        mongosh --eval "
          try {
            rs.status().ok
          } catch (e) {
            rs.initiate({
              _id: 'rs0',
              members: [{ _id: 0, host: 'mongodb:27017' }]
            }).ok
          }
        "
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pyramid-backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "mongodb://root:examplepassword@mongodb:27017/pyramid?authSource=admin&replicaSet=rs0"
      JWT_SECRET: "super-secret-jwt-key-change-in-production"
      JWT_EXPIRES_IN: "7d"
      CORS_ORIGIN: "http://localhost:3001,http://localhost:3000"
      PORT: 3000
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongo_data:
